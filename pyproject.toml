[project]
name = "csv-merge-tool"
version = "0.1.0"
description = "Universal configuration-driven CSV reconciliation and merge CLI"
readme = "README.md"
authors = [
    { name = "f-kittenberger", email = "25imc11692@fh-krems.ac.at" }
]
requires-python = ">=3.13"
dependencies = [
    "pyyaml>=6.0.4",
]

[project.scripts]
csv-merge = "csv_merge.cli:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "csv_merge"
module-root = "src"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
